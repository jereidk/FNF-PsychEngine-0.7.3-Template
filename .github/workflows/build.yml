name: Build

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      os:
        required: true
        type: string
      buildArgs:
        required: true
        type: string
      artifactName:
        required: true
        type: string
      artifactPath:
        required: true
        type: string
      # Optional: set to false to skip this build entirely (used by Main's
      # platform selector -- matrix context is not available in a job-level
      # `if` for reusable workflow calls, so Main passes it via `with:` and
      # this job skips itself instead).
      enabled:
        required: false
        type: boolean
        default: true

env:
  # 4.3.7 is the proven pin for this Lime/Haxe/Flixel/Android stack
  # (same one NightmareVision-Android-Support / Indie-Cross-Public CI uses).
  HAXE_VERSION: 4.3.7
  PROJECT_NAME: PsychEngine
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  # Release tag holding the compiled haxelib tree export. Primary source is
  # NightmareVision's repo; the same tag on THIS repo (published by
  # export-haxelib.yml) acts as the self-hosted mirror fallback.
  EXPORT_TAG: haxelib-cache-export
  NV_EXPORT_REPO: jereidk/NightmareVision-Android-Support

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.os }}
    # Platform selector support: a disabled leg never starts (and never
    # consumes runner minutes). Kept here so any caller (e.g. Main's
    # platform selector) works without per-caller conditionals.
    if: ${{ inputs.enabled != false }}
    # Explicit grant: under restricted default token policies the actions:write
    # permission is what makes cache saves and the stale-cache prune actually
    # work (otherwise they fail SILENTLY -- see Indie-Cross-Public's CI.yml,
    # which needed this for the exact same reason).
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      # Restore/save are separate actions (actions/cache@v4's save-always
      # input is deprecated). Save steps sit at the end of the job, gated on
      # a completeness marker so a half-installed tree can never poison the
      # key (pattern ported from Indie-Cross-Public's CI.yml).
      - name: Cache Haxe libraries
        id: haxelibs-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/haxelib
            .haxelib
          key: haxelibs-${{ runner.os }}-v1-${{ hashFiles('hmm.json') }}

      # Incremental C++ object cache for the transpiled Haxe source, keyed on
      # the source itself: a run that only touches .hx files recompiles only
      # what changed instead of every generated .cpp from scratch.
      - name: Cache hxcpp compile cache
        id: hxcpp-cache
        uses: actions/cache/restore@v4
        with:
          path: .hxcpp_cache
          key: hxcpp-${{ runner.os }}-${{ inputs.name }}-v1-${{ hashFiles('source/**/*.hx', 'Project.xml', 'hmm.json') }}
          restore-keys: |
            hxcpp-${{ runner.os }}-${{ inputs.name }}-v1-

      - name: Update APT
        if: inputs.name == 'Linux'
        run: |
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get update --fix-missing

      - name: Install libVLC
        if: inputs.name == 'Linux'
        run: sudo apt-get install -y libvlc-dev libvlccore-dev

      - name: Setup XCode
        if: inputs.name == 'iOS'
        uses: maxim-lobanov/setup-xcode@master
        with:
          xcode-version: '16.4'

      # ------------------------------------------------------------------
      # Import tier (NightmareVision pattern): on a cold cache, import a
      # prebuilt compiled haxelib tree instead of cloning+compiling
      # lime/hxcpp/openfl/flixel from scratch. Primary source is
      # NightmareVision-Android-Support's `haxelib-cache-export` release,
      # consumable DIRECTLY because hmm.json pins the exact same FunkinCrew
      # fork commits NV does (the pins were overwritten for this purpose).
      # Fallback: the same tag on THIS repo, published by export-haxelib.yml.
      # ------------------------------------------------------------------
      - name: Resolve haxelib export release
        id: export-resolve
        if: steps.haxelibs-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          FOUND=""
          for REPO in "$NV_EXPORT_REPO" "${{ github.repository }}"; do
            # Version marker = newest ASSET timestamp, not publishedAt: NV
            # swaps assets in place on a fixed tag, so updatedAt is what moves.
            UPDATED_AT=$(gh release view "$EXPORT_TAG" --repo "$REPO" --json assets --jq '[.assets[].updatedAt] | max' 2>/dev/null)
            if [ -n "$UPDATED_AT" ]; then
              echo "Found export release on $REPO (assets updated $UPDATED_AT)."
              echo "repo=$REPO" >> "$GITHUB_OUTPUT"
              # Timestamp as the version marker: colons out for a legal key.
              echo "version=$(echo "$UPDATED_AT" | tr -c 'A-Za-z0-9._-' '-')" >> "$GITHUB_OUTPUT"
              FOUND=1
              break
            fi
          done
          if [ -z "$FOUND" ]; then
            echo "No '$EXPORT_TAG' release with assets found -- will install libraries from scratch."
            echo "(Run export-haxelib.yml on this repo once to publish the self-hosted mirror.)"
          fi

      - name: Cache downloaded export tarballs
        id: export-download-cache
        if: steps.haxelibs-cache.outputs.cache-hit != 'true' && steps.export-resolve.outputs.version != ''
        uses: actions/cache/restore@v4
        with:
          path: /tmp/export-import
          key: export-dl-${{ runner.os }}-${{ steps.export-resolve.outputs.version }}

      - name: Import exported haxelib tree
        id: import-export
        if: steps.haxelibs-cache.outputs.cache-hit != 'true' && steps.export-resolve.outputs.version != ''
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          echo "imported=false" >> "$GITHUB_OUTPUT"
          EXPORT_REPO="${{ steps.export-resolve.outputs.repo }}"
          if [ "${{ steps.export-download-cache.outputs.cache-hit }}" != 'true' ]; then
            mkdir -p /tmp/export-import
            gh release download "$EXPORT_TAG" --repo "$EXPORT_REPO" --dir /tmp/export-import --clobber
          else
            echo "Reusing previously-downloaded export ($EXPORT_TAG from $EXPORT_REPO)."
          fi
          # Assets are 1900MB parts (release assets cap at 2GB); reassemble.
          # Two checks, catching different failures: the set of parts present
          # must EXACTLY match the manifest (an extra stale part would slip
          # into the cat and corrupt the reassembly), then the checksums.
          ( cd /tmp/export-import \
            && ls ./*.part.* 2>/dev/null | sed 's#^\./##' | sort > /tmp/export-present.txt \
            && awk '{print $NF}' SHA256SUMS | sed 's#^\./##' | sort > /tmp/export-manifest.txt \
            && diff -u /tmp/export-manifest.txt /tmp/export-present.txt ) \
            || { echo "Downloaded export does not match its manifest -- refusing to import."; exit 1; }
          ( cd /tmp/export-import && sha256sum -c SHA256SUMS ) \
            || { echo "Export checksums do not match -- refusing a corrupt tree."; exit 1; }
          cat /tmp/export-import/haxelib-root.tar.gz.part.* > /tmp/export-import/haxelib-root.tar.gz
          cat /tmp/export-import/haxelib-project.tar.gz.part.* > /tmp/export-import/haxelib-project.tar.gz
          tar -xzf /tmp/export-import/haxelib-root.tar.gz -C "$HOME"
          tar -xzf /tmp/export-import/haxelib-project.tar.gz -C .
          rm -f /tmp/export-import/haxelib-root.tar.gz /tmp/export-import/haxelib-project.tar.gz
          # Dev-link registry entries store the ABSOLUTE checkout path of the
          # exporting runner (NV's or ours). Rewrite ANY /home/runner/work/X/X
          # prefix to this workspace or haxelib can't even parse the packages'
          # haxelib.json.
          grep -rlFI '/home/runner/work/' ~/haxelib .haxelib 2>/dev/null | while IFS= read -r f; do
            sed -i -E 's#/home/runner/work/[^/"]+/[^/"]+#'"$GITHUB_WORKSPACE"'#g' "$f"
            echo "Rewrote stale path in: $f"
          done
          haxelib setup ~/haxelib
          echo "imported=true" >> "$GITHUB_OUTPUT"
          echo "Imported exported haxelib tree ($EXPORT_TAG from $EXPORT_REPO)."

      # ALWAYS runs: even a successfully imported tree only covers the shared
      # packages (lime/openfl/flixel/etc. -- pins now identical to NV's), while
      # hmm still has to add the Psych-only deps (SScript, linc_luajit,
      # hxCodec, tjson, flxanimate, flixel-tools).
      #
      # haxelib's `git <name> <url> <ref>` on an ALREADY-installed lib runs its
      # update() path -- a bare `git pull` (haxelib 4.1.1, Vcs.hx). On imported
      # or cached trees that pull aborts with "Need to specify how to reconcile
      # divergent branches" (git >= 2.27) or fast-forwards the clone PAST its
      # pin. scripts/align_haxelib_pins.sh checks out every git dep exactly at
      # its hmm.json ref first, with a local upstream for SHA pins so the pull
      # is a no-op and branch pins pull as clean fast-forwards.
      - name: Install Libraries
        run: |
          sh ./scripts/align_haxelib_pins.sh
          haxelib install hmm --quiet
          haxelib run hmm install --quiet

      - name: Configure Android x64
        if: inputs.name == 'Android x64'
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_LATEST_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME_17_arm64
          haxelib run lime config ANDROID_SETUP true

      - name: Configure Android x32
        if: inputs.name == 'Android x32'
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_LATEST_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME_17_arm64
          haxelib run lime config ANDROID_SETUP true

      - name: Compile
        env:
          # Workspace-relative (not ~) so it resolves identically on
          # Windows/macOS/Linux runners; must match the cache path above.
          HXCPP_COMPILE_CACHE: ${{ github.workspace }}/.hxcpp_cache
        run: haxelib run lime build ${{ inputs.buildArgs }}

      - name: Make IPA
        if: inputs.name == 'iOS'
        run: |
          cd export/release/ios/build/Release-iphoneos
          mkdir Payload
          mv *.app Payload
          zip -r ${{ env.PROJECT_NAME }}.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@main
        with:
          name: ${{ inputs.artifactName }}
          path: ${{ inputs.artifactPath }}
          if-no-files-found: error

      # lime.ndll/liblime *.so are the last thing the install chain produces;
      # their presence means the tree is usable. Saving on failure WITHOUT
      # this guard is how Indie-Cross-Public's haxelibs cache got poisoned:
      # a half-built tree published under the key every later run restores.
      - name: Check Haxe library tree is complete
        id: libcheck
        if: always()
        shell: bash
        run: |
          if compgen -G ".haxelib/lime/git/ndll/*/lime.ndll" > /dev/null \
            || compgen -G ".haxelib/lime/git/ndll/Android/*.so" > /dev/null; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
            echo "Library tree looks complete -- safe to cache."
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
            echo "Library tree is INCOMPLETE -- refusing to save the haxelibs cache."
          fi

      - name: Save Haxe libraries cache
        if: always() && steps.libcheck.outputs.complete == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/haxelib
            .haxelib
          key: haxelibs-${{ runner.os }}-v1-${{ hashFiles('hmm.json') }}

      # Every source change mints a brand-new hxcpp cache key; old generations
      # are never replaced, only added to, until GitHub starts evicting other
      # caches. This keeps only the newest generation under the prefix.
      - name: Prune stale hxcpp caches
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          PREFIX="hxcpp-${{ runner.os }}-${{ inputs.name }}-v1-"
          gh api "repos/${{ github.repository }}/actions/caches" --paginate \
            --jq ".actions_caches[] | select(.key | startswith(\"$PREFIX\")) | \"\(.id) \(.created_at)\"" \
            > /tmp/caches.txt || exit 0
          # sed '$d', not `head -n -1`: BSD head (macOS runners) rejects
          # negative line counts, and prune must also work on the Mac/iOS jobs.
          sort -t' ' -k2,2 /tmp/caches.txt | sed '$d' | awk '{print $1}' | while read -r id; do
            echo "Deleting stale cache $id"
            gh api -X DELETE "repos/${{ github.repository }}/actions/caches/$id" || true
          done

      - name: Save hxcpp compile cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .hxcpp_cache
          key: hxcpp-${{ runner.os }}-${{ inputs.name }}-v1-${{ hashFiles('source/**/*.hx', 'Project.xml', 'hmm.json') }}
